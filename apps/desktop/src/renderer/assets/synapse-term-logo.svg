<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

    <defs>
        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#06B6D4"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect x="48"
          y="48"
          width="416"
          height="416"
          rx="88"
          fill="#111827"/>

    <!-- Prompt -->
    <polyline points="120,200 180,256 120,312"
              fill="none"
              stroke="url(#g)"
              stroke-width="20"
              stroke-linecap="round"
              stroke-linejoin="round"/>

    <!-- Session -->
    <rect x="220"
          y="228"
          width="48"
          height="48"
          rx="10"
          fill="url(#g)"/>

    <!-- Connections -->
    <line x1="268" y1="252" x2="340" y2="170"
          stroke="url(#g)"
          stroke-width="10"/>

    <line x1="268" y1="252" x2="360" y2="252"
          stroke="url(#g)"
          stroke-width="10"/>

    <line x1="268" y1="252" x2="340" y2="334"
          stroke="url(#g)"
          stroke-width="10"/>

    <!-- Agent Nodes -->
    <circle cx="360" cy="160" r="18" fill="url(#g)"/>
    <circle cx="380" cy="252" r="18" fill="url(#g)"/>
    <circle cx="360" cy="344" r="18" fill="url(#g)"/>

</svg>
