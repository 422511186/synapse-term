<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

    <defs>
        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#06B6D4"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect x="48"
          y="48"
          width="416"
          height="416"
          rx="88"
