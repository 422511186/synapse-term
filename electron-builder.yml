appId: com.synapseterm.desktop
productName: Synapse Term
asar: true
asarUnpack:
  - '**/node_modules/node-pty/**'
npmRebuild: true
electronVersion: 43.2.0
electronDist: apps/desktop/node_modules/electron/dist
icon: icon.png
directories:
  output: release
  app: apps/desktop
  buildResources: build
files:
  - package.json
  - dist/**/*
  - '!node_modules/@synapse-term/**'
  - '!node_modules/**/*.test.{js,ts,tsx}'
  - '!node_modules/**/*.map'
extraMetadata:
  main: dist/main/electron-main.mjs
win:
  icon: icon.png
  target: nsis
  artifactName: Synapse-Term-${version}-${arch}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh

mac:
  icon: icon.icns
  target: dmg
  artifactName: Synapse-Term-${version}-${arch}.${ext}
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
